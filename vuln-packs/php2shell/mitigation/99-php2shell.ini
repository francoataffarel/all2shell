; all2shell — PHP2Shell emergency mitigation (CVE-2026-109619, CVE-2026-115560)
;
; PARTIAL mitigation. Disabling session upload progress closes the 109619 session path
; (and the later CVE-2026-115560 path), but does NOT repair CVE-2026-109618 or every
; execution path. The only complete fix is updating PHP to 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35.
;
; This must apply BEFORE request parsing, so install it where the web SAPI reads it — the
; FPM/Apache php.ini or an FPM pool — NOT the CLI php.ini, then restart the workers.
;   cp 99-php2shell.ini /etc/php/<ver>/fpm/conf.d/99-php2shell.ini   # (path varies by distro)
;   systemctl reload php*-fpm   # or: systemctl restart apache2
; Verify with phpinfo(): session.upload_progress.enabled must read Off, and the
; "Loaded Configuration File" row must point at the file you edited.

session.upload_progress.enabled = Off
